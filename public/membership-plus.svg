<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" fill="none" role="img" aria-label="Strike Plus — futuristic digital workspace">
  <defs>
    <linearGradient id="plus-bg" x1="0" y1="0" x2="800" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="1" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="plus-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="plus-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="plus-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="plus-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="300" fill="url(#plus-bg)"/>
  <rect width="800" height="300" fill="url(#plus-grid)"/>

  <!-- ambient cyan glow orbs -->
  <circle cx="120" cy="70" r="90" fill="#22d3ee" opacity="0.10" filter="url(#plus-glow)"/>
  <circle cx="700" cy="240" r="110" fill="#3b82f6" opacity="0.10" filter="url(#plus-glow)"/>

  <!-- circuit traces -->
  <g stroke="url(#plus-cyan)" stroke-width="1.5" opacity="0.5" fill="none">
    <path d="M0 250 H90 L120 220 H210"/>
    <path d="M800 60 H690 L660 90 H560"/>
    <circle cx="210" cy="220" r="4" fill="#22d3ee" stroke="none"/>
    <circle cx="560" cy="90" r="4" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- code editor window -->
  <g filter="url(#plus-glow)">
    <rect x="250" y="70" width="300" height="160" rx="14" fill="#0b1524" stroke="#22d3ee" stroke-opacity="0.45"/>
  </g>
  <rect x="250" y="70" width="300" height="34" rx="14" fill="#0e1c30"/>
  <circle cx="272" cy="87" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="290" cy="87" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="308" cy="87" r="5" fill="#22c55e" opacity="0.8"/>
  <g>
    <rect x="270" y="124" width="60"  height="9" rx="4.5" fill="#22d3ee" opacity="0.9"/>
    <rect x="338" y="124" width="120" height="9" rx="4.5" fill="#38bdf8" opacity="0.4"/>
    <rect x="286" y="146" width="90"  height="9" rx="4.5" fill="#3b82f6" opacity="0.7"/>
    <rect x="384" y="146" width="70"  height="9" rx="4.5" fill="#38bdf8" opacity="0.3"/>
    <rect x="286" y="168" width="140" height="9" rx="4.5" fill="#38bdf8" opacity="0.35"/>
    <rect x="270" y="190" width="80"  height="9" rx="4.5" fill="#22d3ee" opacity="0.9"/>
    <rect x="358" y="190" width="50"  height="9" rx="4.5" fill="#38bdf8" opacity="0.3"/>
  </g>

  <!-- growth bars -->
  <g>
    <rect x="600" y="180" width="26" height="50"  rx="5" fill="url(#plus-bar)" opacity="0.55"/>
    <rect x="634" y="150" width="26" height="80"  rx="5" fill="url(#plus-bar)" opacity="0.75"/>
    <rect x="668" y="110" width="26" height="120" rx="5" fill="url(#plus-bar)"/>
    <path d="M604 176 L648 150 L688 104" stroke="#67e8f9" stroke-width="2.5" fill="none" opacity="0.9"/>
    <circle cx="688" cy="104" r="5" fill="#67e8f9"/>
  </g>
</svg>
